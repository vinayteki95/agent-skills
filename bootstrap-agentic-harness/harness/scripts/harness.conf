# Central harness configuration — single place for project-specific values.
# Sourced by scripts/*.sh. Keep it POSIX-sh compatible.

# Project identity
PROJECT_SLUG="{{PROJECT_SLUG}}"

# Set to 1 in the environment (e.g. {{STRICT_ENV}}=1) to make pre-push block.
STRICT_ENV_VAR="{{STRICT_ENV}}"

# Forbidden user-facing copy (regex, case-insensitive). Extend per PRODUCT_SENSE.
# Example tone rule: never shame the user. Trim/replace for your product.
COPY_FORBIDDEN_PATTERNS='you failed|you fail|addict|guilty|discipline required'

# Where user-facing copy lives (space-separated globs relative to repo root).
# Point at your strings/i18n/spec files. Missing paths are skipped, not failed.
COPY_SCAN_GLOBS='docs/product-specs/*.md'

# Secret detection: filenames that must never be committed (case sensitive glob).
SECRET_BLOCK_GLOBS='*.jks *.keystore *.pem *.p12 .env .env.* google-services.json credentials.json id_rsa'

# Secret content patterns (regex). AWS, Stripe live, private keys, generic tokens.
SECRET_CONTENT_PATTERNS='AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{16,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'

# Branch naming: allowed prefixes.
BRANCH_TYPES='feature|fix|hotfix|release|chore|docs|refactor|test'

# AGENTS.md size budget (lines). It is a map, not an encyclopedia.
AGENTS_MAX_LINES=140
